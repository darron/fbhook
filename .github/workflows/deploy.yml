name: Deploy to Fly
on:
  workflow_dispatch:
    inputs:
      app:
        description: Existing dedicated Fly application
        default: darron-fbhook
        required: true
        type: string
      region:
        description: Existing single worker region
        default: yyz
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fly-${{ inputs.app }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.13.0
      - name: Install pinned lint tool
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: make check
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.5.1
      - name: Deploy with Fly CLI
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEPLOY_APP: ${{ inputs.app }}
          DEPLOY_REGION: ${{ inputs.region }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -z "$(git status --porcelain --untracked-files=all)"
          fly deploy --app "$DEPLOY_APP" --primary-region "$DEPLOY_REGION" \
            --remote-only --ha=false \
            --build-arg "BUILD_REVISION=$DEPLOY_REVISION" --build-arg BUILD_STATE=clean
