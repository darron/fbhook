name: Update Homebrew
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: homebrew-fbhook
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify published assets and update formula
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
        run: python3 scripts/update_homebrew.py --repo "$RELEASE_REPO" --tag "$RELEASE_TAG"
